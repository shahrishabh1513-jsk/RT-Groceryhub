<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — RT-Groceryhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<!-- Razorpay Checkout SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
.checkout-layout { display:grid; grid-template-columns:1fr 420px; gap:32px; padding:48px 0; align-items:start; }
.checkout-steps { display:flex; align-items:center; gap:0; margin-bottom:32px; }
.step { display:flex; align-items:center; gap:10px; }
.step__num { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.82rem; font-weight:800; flex-shrink:0; }
.step.done   .step__num { background:var(--green-600); color:#fff; }
.step.active .step__num { background:var(--orange); color:#fff; }
.step.todo   .step__num { background:var(--gray-200); color:var(--gray-500); }
.step__label { font-size:.82rem; font-weight:600; color:var(--gray-500); }
.step.active .step__label { color:var(--gray-800); }
.step__line  { flex:1; height:2px; background:var(--gray-200); margin:0 8px; }
.step.done .step__line { background:var(--green-600); }

.checkout-card { background:var(--white); border-radius:var(--radius-xl); padding:28px; border:1.5px solid var(--gray-100); box-shadow:var(--shadow-sm); margin-bottom:20px; }
.checkout-card__title { display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-size:1rem; font-weight:700; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--gray-100); }
.checkout-card__title i { color:var(--green-600); font-size:1rem; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* Payment method cards */
.pay-methods { display:flex; flex-direction:column; gap:10px; }
.pay-method {
  display:flex; align-items:center; gap:14px; padding:16px 18px;
  border:2px solid var(--gray-200); border-radius:var(--radius-lg);
  cursor:pointer; transition:var(--transition); background:var(--white);
}
.pay-method:hover { border-color:var(--green-300); background:var(--green-50); }
.pay-method.selected { border-color:var(--green-600); background:var(--green-50); }
.pay-method__radio { width:18px; height:18px; border-radius:50%; border:2px solid var(--gray-300); background:var(--white); transition:var(--transition); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.pay-method.selected .pay-method__radio { border-color:var(--green-600); background:var(--green-600); }
.pay-method.selected .pay-method__radio::after { content:''; width:6px; height:6px; border-radius:50%; background:#fff; display:block; }
.pay-method__icon { font-size:1.6rem; flex-shrink:0; width:36px; text-align:center; }
.pay-method__info h4 { font-size:.88rem; font-weight:700; margin-bottom:2px; }
.pay-method__info p  { font-size:.76rem; color:var(--gray-400); }
.pay-method__logos { margin-left:auto; display:flex; gap:6px; font-size:.9rem; color:var(--gray-400); }

/* Order summary card */
.summary-sticky { position:sticky; top:88px; }
.summary-card { background:var(--white); border-radius:var(--radius-xl); padding:24px; border:1.5px solid var(--gray-100); box-shadow:var(--shadow-sm); }
.summary-items { max-height:300px; overflow-y:auto; margin-bottom:16px; }
.summary-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--gray-100); }
.summary-item img { width:58px; height:58px; object-fit:cover; border-radius:10px; flex-shrink:0; }
.summary-item__info { flex:1; min-width:0; }
.summary-item__name  { font-weight:600; font-size:.83rem; line-height:1.3; }
.summary-item__brand { font-size:.72rem; color:var(--green-600); font-weight:600; }
.summary-item__meta  { display:flex; justify-content:space-between; margin-top:6px; }
.summary-item__qty   { font-size:.78rem; color:var(--gray-400); }
.summary-item__price { font-size:.88rem; font-weight:700; }

.summary-totals { border-top:1px solid var(--gray-100); padding-top:14px; }
.summary-row { display:flex; justify-content:space-between; font-size:.87rem; padding:5px 0; }
.summary-row.saving { color:var(--green-600); font-weight:600; }
.summary-row.total  { font-size:1.05rem; font-weight:800; color:var(--gray-900); border-top:1px solid var(--gray-100); padding-top:12px; margin-top:6px; }

.coupon-block { background:var(--gray-50); border-radius:var(--radius-lg); padding:14px; margin-bottom:16px; }
.coupon-block label { font-size:.8rem; font-weight:700; color:var(--gray-600); display:block; margin-bottom:8px; }
.coupon-row { display:flex; gap:8px; }
.coupon-row input { flex:1; padding:9px 12px; border:1.5px solid var(--gray-200); border-radius:8px; font-size:.85rem; transition:var(--transition); }
.coupon-row input:focus { outline:none; border-color:var(--green-500); }
.coupon-row button { padding:9px 14px; background:var(--gray-800); color:#fff; border-radius:8px; font-weight:600; font-size:.82rem; transition:var(--transition); border:none; cursor:pointer; }
.coupon-row button:hover { background:var(--green-700); }

.place-order-btn {
  width:100%; padding:15px; border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--green-700),var(--green-500));
  color:#fff; font-size:1rem; font-weight:700; font-family:'Sora',sans-serif;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:var(--transition); border:none; cursor:pointer; margin-top:16px;
  animation:pulseGlow 2.5s infinite;
}
.place-order-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(22,163,74,.4); animation:none; }
.place-order-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; animation:none; }

.secure-badges { display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 0; border-top:1px solid var(--gray-100); margin-top:14px; }
.secure-badges span { font-size:.72rem; color:var(--gray-400); }
.secure-badges i { color:var(--gray-400); }

/* Empty cart */
.checkout-empty { text-align:center; padding:80px 20px; }
.checkout-empty i { font-size:3.5rem; color:var(--gray-200); margin-bottom:20px; }

/* Pay loader overlay */
.pay-loader { position:fixed; inset:0; background:rgba(255,255,255,.96); z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.pay-loader.active { display:flex; }
.pay-loader__spinner { width:64px; height:64px; border:5px solid var(--green-100); border-top-color:var(--green-600); border-radius:50%; animation:spin 0.8s linear infinite; }
.pay-loader h3 { font-size:1.1rem; font-family:'Sora',sans-serif; color:var(--gray-800); }
.pay-loader p  { font-size:.85rem; color:var(--gray-400); }

@media(max-width:900px){ .checkout-layout{ grid-template-columns:1fr; } .summary-sticky{ position:static; } }
@media(max-width:580px){ .form-grid{ grid-template-columns:1fr; } }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo/favicon-32.png"><link rel="apple-touch-icon" href="assets/images/logo/favicon-192.png"><link rel="stylesheet" href="assets/css/rt-theme.css">
</head>

<div style="background:var(--gray-50);border-bottom:1px solid var(--gray-100);padding:10px 0">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Home</a><span class="sep"><i class="fas fa-chevron-right" style="font-size:.6rem"></i></span>
      <a href="shop.html">Shop</a><span class="sep"><i class="fas fa-chevron-right" style="font-size:.6rem"></i></span>

</div>

<div class="container">
  <!-- Steps -->
  <div class="checkout-steps" style="margin-top:32px">
    <div class="step done"><div class="step__num"><i class="fas fa-check"></i></div><div class="step__label">Cart</div></div>
    <div class="step__line done"></div>

<footer class="rt-footer"><div class="rt-footer__row"><a href="index.html" class="rt-footer__brand"><img src="assets/images/logo/rt-groceryhub-logo.png" alt="RT-Groceryhub"></a><nav class="rt-footer__nav" aria-label="Footer"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="rt-footer__social"><a href="https://github.com/shahrishabh1513-jsk" target="_blank" rel="noopener" aria-label="GitHub profile"><i class="fab fa-github"></i></a><a href="https://github.com/shahrishabh1513-jsk/RT-Groceryhub" target="_blank" rel="noopener" aria-label="Project repository"><i class="fas fa-code-branch"></i></a></div></div><div class="rt-footer__bottom">© 2026 RT-Groceryhub. All Rights Reserved. | Designed &amp; Developed by RT1504</div></footer>

<script>
// ================================================================
//  RT-Groceryhub — Checkout + Razorpay Payment Gateway
//
//  TEST CREDENTIALS (no real money):
//  Key:  rzp_test_1DP5mmOlF5G5ag
//  Test cards: 4111 1111 1111 1111 (Visa)
//               5267 3181 8797 5449 (Mastercard)
//  UPI:  success@razorpay
//
//  FOR PRODUCTION:
//  1. Create account at razorpay.com
//  2. Get your Key ID from Settings → API Keys
//  3. Replace RAZORPAY_KEY below
//  4. Create order server-side (POST /v1/orders) and pass order_id
//  5. Verify payment signature on your server
// ================================================================
const RAZORPAY_KEY = 'rzp_test_1DP5mmOlF5G5ag';

let cartItems = [];
let appliedDiscount = 0;
let appliedCoupon = '';
let selectedMethod = 'razorpay';

function getDelivery(sub) { return sub >= 499 ? 0 : 49; }
function getTotal()       { return cartItems.reduce((s,i)=>s+i.price*i.qty,0) - appliedDiscount + getDelivery(cartItems.reduce((s,i)=>s+i.price*i.qty,0) - appliedDiscount); }

function init() {
  cartItems = getCart();
  const main = document.getElementById("checkout-main");

  if (!cartItems.length) {
    main.innerHTML = `
      <div class="checkout-empty" style="grid-column:span 2">
        <i class="fas fa-shopping-basket"></i>
        <h2 style="color:var(--gray-600);margin-bottom:12px">Your cart is empty</h2>
        <p style="color:var(--gray-400);margin-bottom:24px">Add some fresh products before checking out.</p>
        <a href="shop.html" class="btn btn-primary"><i class="fas fa-store"></i> Continue Shopping</a>
      </div>`;
    return;
  }

  const user = getUser() || {};

  main.innerHTML = `
    <!-- LEFT: Form -->
    <div>
      <!-- Contact Info -->
      <div class="checkout-card">
        <div class="checkout-card__title"><i class="fas fa-user"></i> Contact Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">First Name <span class="req">*</span></label>
            <input type="text" id="f-fname" class="form-input" placeholder="Aarav" value="${user.fname||''}">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name <span class="req">*</span></label>
            <input type="text" id="f-lname" class="form-input" placeholder="Sharma" value="${user.lname||''}">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Email Address <span class="req">*</span></label>
            <input type="email" id="f-email" class="form-input" placeholder="aarav@email.com" value="${user.email||''}">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number <span class="req">*</span></label>
            <input type="tel" id="f-phone" class="form-input" placeholder="+91 98765 43210" value="${user.phone||''}">
          </div>
        </div>
      </div>

      <!-- Delivery Address -->
      <div class="checkout-card">
        <div class="checkout-card__title"><i class="fas fa-map-marker-alt"></i> Delivery Address</div>
        <div class="form-group">
          <label class="form-label">Full Address <span class="req">*</span></label>
          <input type="text" id="f-address" class="form-input" placeholder="Flat / House No., Street, Area">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">City <span class="req">*</span></label>
            <input type="text" id="f-city" class="form-input" placeholder="Mumbai">
          </div>
          <div class="form-group">
            <label class="form-label">Pincode <span class="req">*</span></label>
            <input type="text" id="f-pin" class="form-input" placeholder="400001" maxlength="6">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">State</label>
          <select id="f-state" class="form-input">
            <option value="">Select State</option>
            ${["Maharashtra","Karnataka","Delhi","Tamil Nadu","Gujarat","Rajasthan","Uttar Pradesh","West Bengal","Telangana","Kerala","Madhya Pradesh","Andhra Pradesh","Punjab","Haryana","Bihar","Odisha","Jharkhand","Chhattisgarh","Assam","Uttarakhand","Himachal Pradesh","Goa","Sikkim","Tripura","Manipur","Nagaland","Meghalaya","Mizoram","Arunachal Pradesh","J&K","Ladakh"].map(s=>`<option>${s}</option>`).join("")}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Delivery Instructions <span style="color:var(--gray-400);font-weight:400">(Optional)</span></label>
          <textarea id="f-notes" class="form-input" placeholder="Gate code, landmark, preferred time…" style="min-height:75px"></textarea>
        </div>
      </div>

      <!-- Payment Method -->
      <div class="checkout-card">
        <div class="checkout-card__title"><i class="fas fa-credit-card"></i> Payment Method</div>
        <div class="pay-methods" id="pay-methods">
          <div class="pay-method selected" data-method="razorpay" onclick="selectMethod('razorpay')">
            <div class="pay-method__radio"></div>
            <div class="pay-method__icon">🏦</div>
            <div class="pay-method__info">
              <h4>Pay Online — Cards, UPI, Wallets</h4>
              <p>Secured by Razorpay · Instant payment confirmation</p>
            </div>
            <div class="pay-method__logos">
              <i class="fab fa-cc-visa"></i>
              <i class="fab fa-cc-mastercard"></i>
              <i class="fas fa-mobile-screen-button" title="UPI"></i>
              <i class="fas fa-wallet" title="Wallets"></i>
            </div>
          </div>
          <div class="pay-method" data-method="cod" onclick="selectMethod('cod')">
            <div class="pay-method__radio"></div>
            <div class="pay-method__icon">💵</div>
            <div class="pay-method__info">
              <h4>Cash on Delivery</h4>
              <p>Pay with cash when your order arrives · Available on orders under ₹5,000</p>
            </div>
          </div>
        </div>

        <!-- Razorpay badge -->
        <div id="razorpay-badge" style="margin-top:14px;padding:12px 16px;background:linear-gradient(135deg,#072654,#1a4fba);border-radius:var(--radius-lg);display:flex;align-items:center;gap:12px;color:#fff">
          <img src="https://razorpay.com/favicon.png" width="24" onerror="this.style.display='none'">
          <div style="font-size:.8rem">
            <div style="font-weight:700">Powered by Razorpay</div>
            <div style="opacity:.7;font-size:.72rem">256-bit SSL · PCI-DSS compliant · RBI authorised</div>
          </div>
          <div style="margin-left:auto;font-size:.78rem;opacity:.8">Test mode active</div>
        </div>

        <div style="margin-top:14px;padding:12px;background:var(--green-50);border-radius:10px;font-size:.78rem;color:var(--green-700)">
          <strong>🧪 Test Payment Credentials:</strong><br>
          Card: <code>4111 1111 1111 1111</code> · Exp: any future date · CVV: any 3 digits<br>
          UPI: <code>success@razorpay</code>
        </div>
      </div>
    </div>

    <!-- RIGHT: Order Summary -->
    <div class="summary-sticky">
      <div class="summary-card">
        <h3 style="font-family:'Sora',sans-serif;font-size:1rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-100)">
          📦 Order Summary (${cartItems.length} item${cartItems.length!==1?'s':''})
        </h3>

        <div class="summary-items">
          ${cartItems.map(item=>`
            <div class="summary-item">
              <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/58x58/dcfce7/16a34a?text=GB'">
              <div class="summary-item__info">
                <div class="summary-item__name">${item.name}</div>
                <div class="summary-item__brand">${item.brand}</div>
                <div class="summary-item__meta">
                  <span class="summary-item__qty">×${item.qty} · ${item.unit}</span>
                  <span class="summary-item__price">${fmt(item.price*item.qty)}</span>
                </div>
              </div>
            </div>`).join('')}
        </div>

        <!-- Coupon -->
        <div class="coupon-block">
          <label><i class="fas fa-tag"></i> Have a coupon?</label>
          <div class="coupon-row">
            <input type="text" id="co-input" placeholder="FRESH20, GREEN10…">
            <button onclick="applyCouponCO()">Apply</button>
          </div>
          <div id="co-msg" style="font-size:.76rem;margin-top:6px"></div>
          <div style="font-size:.73rem;color:var(--gray-400);margin-top:6px">Try: FRESH20 · GREEN10 · WELCOME50 · BASKET15</div>
        </div>

        <!-- Totals -->
        <div class="summary-totals" id="summary-totals"></div>

        <button class="place-order-btn" id="place-order-btn" onclick="placeOrder()">
          <i class="fas fa-lock"></i>
          <span id="place-btn-text">Place Order & Pay</span>
        </button>

        <div class="secure-badges">
          <i class="fas fa-shield-halved"></i>
          <span>256-bit SSL Encryption</span>
          <span>·</span>
          <i class="fab fa-cc-visa"></i>
          <i class="fab fa-cc-mastercard"></i>
          <i class="fas fa-mobile-screen-button" title="UPI"></i>
        </div>
      </div>
    </div>`;

  renderTotals();
}

function renderTotals() {
  const subtotal  = cartItems.reduce((s,i)=>s+i.price*i.qty, 0);
  const delivery  = getDelivery(subtotal);
  const total     = subtotal - appliedDiscount + delivery;
  const el = document.getElementById("summary-totals");
  if (!el) return;
  el.innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
    ${appliedDiscount>0?`<div class="summary-row saving"><span>Discount (${appliedCoupon})</span><span>−${fmt(appliedDiscount)}</span></div>`:''}
    <div class="summary-row"><span>Delivery${delivery===0?' 🎉':''}</span><span>${delivery===0?'<span style="color:var(--green-600);font-weight:700">FREE</span>':fmt(delivery)}</span></div>
    ${delivery===0?`<div style="font-size:.73rem;color:var(--green-600);text-align:right;margin-top:-2px;margin-bottom:4px">Free delivery on orders ₹499+</div>`:''}
    <div class="summary-row total"><span>Total Payable</span><span style="color:var(--green-700)">${fmt(total)}</span></div>`;

  const btn = document.getElementById("place-btn-text");
  if (btn) btn.textContent = selectedMethod==='cod' ? `Place Order (COD · ${fmt(total)})` : `Pay Securely · ${fmt(total)}`;
}

function selectMethod(method) {
  selectedMethod = method;
  document.querySelectorAll(".pay-method").forEach(el => {
    el.classList.toggle("selected", el.dataset.method === method);
  });
  const badge = document.getElementById("razorpay-badge");
  if (badge) badge.style.display = method === 'razorpay' ? 'flex' : 'none';
  renderTotals();
}

const COUPONS2 = { "FRESH20":20, "GREEN10":10, "BASKET15":15, "WELCOME50":50 };
function applyCouponCO() {
  const code  = document.getElementById("co-input")?.value?.trim()?.toUpperCase();
  const msgEl = document.getElementById("co-msg");
  const subtotal = cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  if (!code) { if(msgEl) msgEl.innerHTML='<span style="color:var(--red)">Enter a coupon code.</span>'; return; }
  if (COUPONS2[code]) {
    const val = COUPONS2[code];
    appliedDiscount = code==='WELCOME50' ? 50 : Math.round(subtotal*val/100);
    appliedCoupon   = code;
    if(msgEl) msgEl.innerHTML=`<span style="color:var(--green-600)">✓ Coupon applied! You save ${fmt(appliedDiscount)}</span>`;
    renderTotals();
  } else {
    appliedDiscount = 0; appliedCoupon='';
    if(msgEl) msgEl.innerHTML=`<span style="color:var(--red)">Invalid code. Try FRESH20 or GREEN10.</span>`;
    renderTotals();
  }
}

function validate() {
  const fields = [
    { id:'f-fname',   label:'First name' },
    { id:'f-lname',   label:'Last name' },
    { id:'f-email',   label:'Email address' },
    { id:'f-phone',   label:'Phone number' },
    { id:'f-address', label:'Delivery address' },
    { id:'f-city',    label:'City' },
    { id:'f-pin',     label:'Pincode' },
  ];
  for (const f of fields) {
    const el = document.getElementById(f.id);
    if (!el?.value?.trim()) {
      showToast(`⚠ Please enter your ${f.label}`, 'error');
      el?.focus(); el?.scrollIntoView({behavior:'smooth',block:'center'});
      return false;
    }
  }
  const phone = document.getElementById('f-phone').value.replace(/\s/g,'');
  if (!/^(\+91)?[6-9]\d{9}$/.test(phone)) {
    showToast('⚠ Enter a valid 10-digit Indian mobile number', 'error');
    return false;
  }
  const pin = document.getElementById('f-pin').value.trim();
  if (!/^\d{6}$/.test(pin)) {
    showToast('⚠ Enter a valid 6-digit pincode', 'error');
    return false;
  }
  return true;
}

function buildOrderObject() {
  const subtotal = cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const delivery = getDelivery(subtotal);
  const total    = subtotal - appliedDiscount + delivery;
  return {
    orderId:    'GB' + Date.now(),
    date:        new Date().toISOString(),
    customer:   {
      firstName: document.getElementById('f-fname').value.trim(),
      lastName:  document.getElementById('f-lname').value.trim(),
      email:     document.getElementById('f-email').value.trim(),
      phone:     document.getElementById('f-phone').value.trim(),
      address:   document.getElementById('f-address').value.trim(),
      city:      document.getElementById('f-city').value.trim(),
      pincode:   document.getElementById('f-pin').value.trim(),
      state:     document.getElementById('f-state').value,
      notes:     document.getElementById('f-notes').value.trim(),
    },
    items:       cartItems,
    subtotal,
    discount:    appliedDiscount,
    coupon:      appliedCoupon,
    delivery,
    total,
    paymentMethod: selectedMethod === 'razorpay' ? 'Online (Razorpay)' : 'Cash on Delivery',
    status:      selectedMethod === 'razorpay' ? 'pending' : 'confirmed',
  };
}

function finalizeOrder(order) {
  // Save to localStorage
  const orders = JSON.parse(localStorage.getItem('gb_orders')||'[]');
  orders.unshift(order);
  localStorage.setItem('gb_orders', JSON.stringify(orders));
  localStorage.setItem('gb_lastorder', JSON.stringify(order));
  // Clear cart
  localStorage.removeItem('gb_cart');
  // Redirect
  window.location.href = 'order-success.html';
}

function placeOrder() {
  if (!validate()) return;
  const order  = buildOrderObject();
  const btn    = document.getElementById('place-order-btn');
  if (btn) btn.disabled = true;

  if (selectedMethod === 'cod') {
    document.getElementById('pay-loader-text').textContent = 'Placing your order…';
    document.getElementById('pay-loader').classList.add('active');
    order.status = 'confirmed';
    setTimeout(() => finalizeOrder(order), 1200);
    return;
  }

  // ── Razorpay Payment ──────────────────────────────────────────
  document.getElementById('pay-loader-text').textContent = 'Opening secure payment…';
  document.getElementById('pay-loader').classList.add('active');

  setTimeout(() => {
    document.getElementById('pay-loader').classList.remove('active');

    if (typeof Razorpay === 'undefined') {
      showToast('Payment gateway failed to load. Please check your internet connection.', 'error');
      if (btn) btn.disabled = false;
      return;
    }

    const options = {
      key:         RAZORPAY_KEY,
      amount:      Math.round(order.total * 100), // amount in paise
      currency:    'INR',
      name:        'RT-Groceryhub',
      description: `Order ${order.orderId} · ${order.items.length} item${order.items.length!==1?'s':''}`,
      // order_id: '',  // PRODUCTION: pass Razorpay order_id from your server here
      prefill: {
        name:    `${order.customer.firstName} ${order.customer.lastName}`,
        email:   order.customer.email,
        contact: order.customer.phone.replace(/\D/g,'').slice(-10),
      },
      notes: {
        order_ref:  order.orderId,
        address:    `${order.customer.address}, ${order.customer.city} ${order.customer.pincode}`,
      },
      theme:  { color: '#16a34a' },
      image:  'https://placehold.co/80x80/16a34a/ffffff?text=GB',

      // ── Success Handler ──────────────────────────────────────
      handler: function(response) {
        document.getElementById('pay-loader-text').textContent = 'Payment successful! Placing your order…';
        document.getElementById('pay-loader').classList.add('active');
        order.paymentId  = response.razorpay_payment_id;
        order.status     = 'paid';
        // PRODUCTION: verify razorpay_signature on your server before finalizing
        setTimeout(() => finalizeOrder(order), 1000);
      },

      modal: {
        ondismiss: function() {
          showToast('Payment cancelled. Your order was not placed.', 'error');
          if (btn) btn.disabled = false;
        }
      }
    };

    const rzp = new Razorpay(options);
    rzp.on('payment.failed', function(resp) {
      showToast(`Payment failed: ${resp.error.description}`, 'error');
      if (btn) btn.disabled = false;
    });
    rzp.open();
  }, 600);
}

// Init
init();
</script>
